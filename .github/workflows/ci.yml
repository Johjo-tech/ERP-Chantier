# Contrôles automatiques : un échec ici doit bloquer la fusion.
#
# Les variables Supabase sont factices : le build a seulement besoin qu'elles
# existent (le client lève une erreur à l'import si elles manquent). Aucun
# secret n'est nécessaire, et TEST_USER_* est volontairement absent — les
# suites d'intégration se désactivent au lieu d'écrire dans une vraie base.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://exemple.supabase.co
      VITE_SUPABASE_ANON_KEY: cle-factice-ci

    steps:
      # Épinglé au SHA : un tag de version est mobile, un commit ne l'est pas.
      # Dependabot proposera les montées de version, visibles en revue.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 22 minimum : @supabase/realtime-js exige un WebSocket natif
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` impose le lockfile : le build de la CI est celui du poste
      - run: npm ci

      - name: Types
        run: npm run type-check

      # L'écran hérité (src/pages/app.js) a sa propre configuration, plus souple :
      # sous le `strict` du dépôt il rend 5 422 erreurs, et un contrôle que
      # personne ne peut mettre au vert devient un voyant qu'on ignore. En mode
      # souple il tient à zéro — et il a déjà relevé une constante que l'écran
      # lisait sur `window` sans que personne l'y pose.
      - name: Types de l'écran
        run: npm run type-check:ecran

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build

  # Analyse statique — et depuis cette branche, l'écran en fait PARTIE.
  #
  # Ce commentaire disait jusqu'ici que `src/pages/index.html` échappait à Semgrep
  # pour deux raisons : le JavaScript en ligne d'un fichier HTML n'est pas extrait,
  # et le fichier dépassait `--max-target-bytes` (1 000 000 octets) de 3 %. Les deux
  # étaient vraies. Elles ne le sont plus : l'écran vit désormais dans
  # `src/pages/app.js`, un fichier JavaScript de plein droit.
  #
  # Mesuré sur cette branche : 126 fichiers analysés, AUCUN écarté, 0 constat.
  # C'est la première fois que les 15 700 lignes de l'écran passent sous une règle.
  #
  # Le piège reste ouvert pour l'avenir : `app.js` pèse 930 ko. Au-delà de
  # 1 000 000 octets il serait écarté EN SILENCE, et le scan resterait vert. Un test
  # (`src/__tests__/taille-ecran.test.ts`) refuse de laisser passer ce seuil.
  securite:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Semgrep
        run: >
          semgrep scan
          --config p/typescript
          --config p/javascript
          --config p/secrets
          --config p/owasp-top-ten
          --exclude=node_modules --exclude=dist
          --exclude=src/api/database.types.ts --exclude=src/api/columns.ts
          --error
          src/ scripts/
