# Contrôles automatiques : un échec ici doit bloquer la fusion.
#
# Les variables Supabase sont factices : le build a seulement besoin qu'elles
# existent (le client lève une erreur à l'import si elles manquent). Aucun
# secret n'est nécessaire, et TEST_USER_* est volontairement absent — les
# suites d'intégration se désactivent au lieu d'écrire dans une vraie base.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://exemple.supabase.co
      VITE_SUPABASE_ANON_KEY: cle-factice-ci

    steps:
      # Épinglé au SHA : un tag de version est mobile, un commit ne l'est pas.
      # Dependabot proposera les montées de version, visibles en revue.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 22 minimum : @supabase/realtime-js exige un WebSocket natif
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` impose le lockfile : le build de la CI est celui du poste
      - run: npm ci

      - name: Types
        run: npm run type-check

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build

  # Analyse statique de la couche TypeScript.
  #
  # Semgrep n'extrait pas le JavaScript inline d'un fichier HTML : le monolithe
  # `src/pages/index.html` et ses 104 écritures `innerHTML` lui restent
  # invisibles. Ce travail-là revient à la relecture des diffs.
  securite:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Semgrep
        run: >
          semgrep scan
          --config p/typescript
          --config p/javascript
          --config p/secrets
          --config p/owasp-top-ten
          --exclude=node_modules --exclude=dist
          --exclude=src/api/database.types.ts --exclude=src/api/columns.ts
          --error
          src/ scripts/
