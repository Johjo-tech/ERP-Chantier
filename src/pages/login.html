<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Chantier - Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Les mêmes trois familles que l'application : la page de connexion ne
       doit pas dépayser au moment où elle bascule sur le tableau de bord. -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       LA FEUILLE DE PLAN.
       On entre dans le logiciel comme on déplie un plan : trame de calque,
       façade qui se trace toute seule au fond, cote avec ses flèches, et le
       cartouche en bas à droite — société, échelle, indice, date — comme sur
       toute feuille de chantier.
       Le décor ne s'arrête jamais ; le formulaire, lui, s'immobilise dès
       qu'il est posé. C'est ce qui fait vivant plutôt qu'agité.
       ═══════════════════════════════════════════════════════════════════ */
    :root{
      --accent:#FF6A1A; --accent-2:#C24E00;
      --papier:#F4F2ED; --encre:#182233; --mine:#5C6879; --trait:#9AA7BC;
      --titre:'Manrope','Segoe UI Semibold',system-ui,-apple-system,Arial,sans-serif;
      --texte:'Inter',-apple-system,BlinkMacSystemFont,system-ui,Arial,sans-serif;
      --cote:'JetBrains Mono',ui-monospace,Menlo,monospace;
    }
    *{box-sizing:border-box;}
    html,body{margin:0; padding:0;}
    body{
      font-family:var(--texte); color:var(--encre);
      background:var(--papier);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px; position:relative; overflow:hidden;
    }

    /* La trame du calque. */
    .calque{
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:
        linear-gradient(rgba(24,34,51,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24,34,51,.05) 1px, transparent 1px);
      background-size:22px 22px;
    }

    /* Le dessin se trace, se tient un moment, puis s'efface par l'autre bout
       et recommence. Chaque trait part avec son propre retard : une façade ne
       se dessine pas d'un seul geste. */
    .dessin{position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none;}
    .dessin path{fill:none; stroke:var(--trait); stroke-width:1.2; vector-effect:non-scaling-stroke;}
    .dessin .t{stroke-dasharray:var(--l); stroke-dashoffset:var(--l); animation:tracer 18s linear infinite;}
    @keyframes tracer{
      0%      {stroke-dashoffset:var(--l);}
      26%,72% {stroke-dashoffset:0;}
      100%    {stroke-dashoffset:calc(var(--l) * -1);}
    }
    .dessin text{fill:var(--mine); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; opacity:0; animation:paraitre 18s linear infinite;}
    @keyframes paraitre{0%,22%{opacity:0;} 32%,70%{opacity:.8;} 80%,100%{opacity:0;}}

    /* ── La feuille ─────────────────────────────────────────────────────── */
    .feuille{
      position:relative; z-index:3; width:100%; max-width:410px;
      background:#fff; border:1px solid var(--trait);
      padding:38px 38px 30px;
      box-shadow:0 18px 44px rgba(24,34,51,.14);
      animation:poser .7s cubic-bezier(.2,.9,.3,1) both;
    }
    @keyframes poser{from{opacity:0; transform:translateY(18px) rotate(-.6deg);} to{opacity:1; transform:none;}}
    /* Le liseré se tire de gauche à droite, comme un trait de règle. */
    .feuille::before{
      content:''; position:absolute; top:-1px; left:-1px; right:-1px; height:4px;
      background:var(--accent); transform-origin:left;
      animation:tirer .6s cubic-bezier(.3,.9,.3,1) .42s both;
    }
    @keyframes tirer{from{transform:scaleX(0);} to{transform:scaleX(1);}}

    @keyframes monter{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

    .login-header{display:flex; align-items:center; gap:12px; margin-bottom:26px; animation:monter .5s ease .3s both;}
    .login-header .sceau{
      width:38px; height:38px; flex-shrink:0; background:var(--encre); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:17px;
    }
    .login-header h1{
      margin:0; font-family:var(--titre); font-weight:800; font-size:20px;
      text-transform:uppercase; letter-spacing:.02em; line-height:1.1;
    }
    .login-header p{
      margin:2px 0 0; font-family:var(--cote); font-size:9.5px; color:var(--mine);
      letter-spacing:.16em; text-transform:uppercase;
    }

    .form-group{margin-bottom:18px;}
    .form-group:nth-of-type(1){animation:monter .5s ease .42s both;}
    .form-group:nth-of-type(2){animation:monter .5s ease .52s both;}

    label{
      display:block; margin-bottom:7px; color:var(--mine);
      font-family:var(--cote); font-size:9.5px; font-weight:500;
      letter-spacing:.14em; text-transform:uppercase;
    }
    input[type="email"], input[type="password"]{
      width:100%; padding:11px 13px;
      border:1px solid var(--trait); border-radius:0;
      background:#FCFCFA; font-size:14px; font-family:inherit; color:var(--encre);
      transition:border-color .18s, box-shadow .18s, background .18s;
    }
    input[type="email"]::placeholder, input[type="password"]::placeholder{color:#B4BDC9;}
    input[type="email"]:focus, input[type="password"]:focus{
      outline:none; background:#fff;
      border-color:var(--accent);
      box-shadow:inset 3px 0 0 var(--accent);
    }

    .btn-login{
      position:relative; overflow:hidden;
      width:100%; padding:13px 16px; margin-top:8px;
      background:var(--accent); color:#fff;
      border:none; border-radius:0; cursor:pointer;
      font-family:var(--titre); font-weight:700; font-size:12.5px;
      text-transform:uppercase; letter-spacing:.12em;
      transition:background .18s;
      animation:monter .5s ease .62s both;
    }
    /* Un trait de crayon repasse sur le bouton, comme on souligne une cote. */
    .btn-login::after{
      content:''; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(105deg, transparent 32%, rgba(255,255,255,.42) 50%, transparent 68%);
      transform:translateX(-120%);
      animation:crayon 4.8s ease-in-out 1.7s infinite;
    }
    @keyframes crayon{0%,74%{transform:translateX(-120%);} 100%{transform:translateX(120%);}}
    .btn-login:hover{background:var(--accent-2);}
    .btn-login:disabled{opacity:.55; cursor:not-allowed;}
    .btn-login:disabled::after{animation:none;}

    .success-message, .error-message, .loading{display:none; margin-top:12px; font-size:13px; line-height:1.45;}
    .success-message{padding:10px 12px; background:#E8F5EC; color:#1E6B37; border-left:3px solid #1E6B37;}
    .error-message{padding:10px 12px; background:#FDECEC; color:#A5262C; border-left:3px solid #D9363E;}
    .loading{font-family:var(--cote); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--mine);}
    .success-message.show, .error-message.show, .loading.show{display:block;}

    .oubli{margin-top:22px; text-align:center; animation:monter .5s ease .72s both;}
    #btnForgot{
      background:none; border:none; cursor:pointer; padding:4px;
      font-family:var(--cote); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--mine); border-bottom:1px solid var(--trait);
    }
    #btnForgot:hover{color:var(--accent-2); border-bottom-color:var(--accent-2);}
    #btnForgot:disabled{opacity:.5; cursor:not-allowed;}

    /* ── Le cartouche ───────────────────────────────────────────────────── */
    .cartouche{
      position:fixed; right:18px; bottom:18px; z-index:4;
      display:grid; grid-template-columns:auto auto;
      border:1px solid var(--trait); background:rgba(255,255,255,.92);
      font-family:var(--cote); font-size:9px; color:var(--mine);
    }
    .cartouche div{padding:5px 11px; border-bottom:1px solid var(--trait); animation:remplir .34s ease both;}
    .cartouche div:nth-child(odd){border-right:1px solid var(--trait); color:#9AA3B2; letter-spacing:.12em;}
    .cartouche div:nth-last-child(-n+2){border-bottom:none;}
    @keyframes remplir{from{opacity:0;} to{opacity:1;}}
    .cartouche div:nth-child(1){animation-delay:.80s} .cartouche div:nth-child(2){animation-delay:.85s}
    .cartouche div:nth-child(3){animation-delay:.90s} .cartouche div:nth-child(4){animation-delay:.95s}
    .cartouche div:nth-child(5){animation-delay:1.00s} .cartouche div:nth-child(6){animation-delay:1.05s}
    .cartouche div:nth-child(7){animation-delay:1.10s} .cartouche div:nth-child(8){animation-delay:1.15s}

    /* Sous 620 px, le cartouche chevaucherait la feuille : il se retire. */
    @media (max-width:620px){
      .cartouche{display:none;}
      .feuille{padding:30px 24px 24px;}
    }

    @media (prefers-reduced-motion:reduce){
      .dessin .t{stroke-dashoffset:0; animation:none;}
      .dessin text{opacity:.8; animation:none;}
      .feuille, .feuille::before, .login-header, .form-group,
      .btn-login, .btn-login::after, .oubli, .cartouche div{animation:none;}
      .feuille::before{transform:none;}
    }
  </style>
</head>
<body>
  <div class="calque"></div>

  <!-- Une coupe de façade : sol, murs, plancher, porte, fenêtre et sa cote.
       Les longueurs `--l` cadencent le tracé ; elles approchent la longueur
       réelle de chaque chemin, une approximation suffit à l'œil. -->
  <svg class="dessin" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path class="t" style="--l:960"  d="M120 640 L1080 640" stroke-width="1.7"/>
    <path class="t" style="--l:1500; animation-delay:-1.6s" d="M200 640 L200 330 L600 150 L1000 330 L1000 640"/>
    <path class="t" style="--l:800;  animation-delay:-3s"   d="M200 330 L1000 330"/>
    <path class="t" style="--l:380;  animation-delay:-4.2s" d="M300 640 L300 490 L380 490 L380 640"/>
    <path class="t" style="--l:560;  animation-delay:-5.2s" d="M700 420 L860 420 L860 540 L700 540 Z"/>
    <path class="t" style="--l:280;  animation-delay:-6s"   d="M780 420 L780 540 M700 480 L860 480"/>
    <path class="t" style="--l:870;  animation-delay:-7s"   d="M200 700 L1000 700 M200 690 L200 710 M1000 690 L1000 710 M192 708 L208 692 M992 708 L1008 692"/>
    <text style="animation-delay:-7s"   x="558" y="694">8 400</text>
    <text style="animation-delay:-5.2s" x="874" y="414">ALLÈGE 0,90</text>
  </svg>

  <main class="feuille">
    <div class="login-header">
      <span class="sceau" aria-hidden="true">&#9630;</span>
      <div>
        <h1>ERP Chantier</h1>
        <p>Devis &middot; Chantiers &middot; Facturation</p>
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Identifiant</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="votre@email.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        Entrer
      </button>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>
      <div class="loading" id="loading">Connexion en cours...</div>
    </form>

    <div class="oubli">
      <button type="button" id="btnForgot">Mot de passe oubli&eacute; ?</button>
    </div>
  </main>

  <div class="cartouche" aria-hidden="true">
    <div>&Eacute;CHELLE</div><div>1:1</div>
    <div>INDICE</div><div>C</div>
    <div>DATE</div><div id="cartoucheDate">&mdash;</div>
  </div>

  <script type="module">
    import { supabase, demanderReinitialisation } from '@/api/client';

    // Session déjà ouverte : on n'affiche pas un formulaire de connexion à
    // quelqu'un de connecté, même s'il arrive ici par « Précédent ».
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.replace('/');
    })();

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnLogin = document.getElementById('btnLogin');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const btnForgot = document.getElementById('btnForgot');
    const loading = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Veuillez remplir tous les champs');
        return;
      }

      btnLogin.disabled = true;
      loading.classList.add('show');
      errorMessage.classList.remove('show');

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          throw error;
        }

        if (data.session) {
          // `replace` et non `href` : sans quoi la page de connexion reste dans
          // l'historique, et « Précédent » y ramène — ce qui donne l'illusion
          // d'une déconnexion alors que la session est toujours valide.
          window.location.replace('/');
        }
      } catch (err) {
        const message = err.message || 'Erreur de connexion. Vérifiez vos identifiants.';
        showError(message);
        btnLogin.disabled = false;
        loading.classList.remove('show');
      }
    });

    function showError(message) {
      successMessage.classList.remove('show');
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }

    function showSuccess(message) {
      errorMessage.classList.remove('show');
      successMessage.textContent = message;
      successMessage.classList.add('show');
    }

    /* Réinitialisation : Supabase envoie un lien qui repose une session
       « recovery » sur nouveau-mot-de-passe.html. */
    btnForgot.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showError('Saisissez votre email, puis cliquez à nouveau.');
        emailInput.focus();
        return;
      }
      btnForgot.disabled = true;
      try {
        await demanderReinitialisation(email);
        showSuccess('Si un compte existe pour ' + email + ', un lien de réinitialisation vient d\'être envoyé.');
      } catch (err) {
        showError(err.message || 'Envoi impossible. Réessayez dans un instant.');
      } finally {
        btnForgot.disabled = false;
      }
    });


    /* Le cartouche porte la date du jour, comme une feuille qu'on vient de
       sortir. Écrite ici et non en dur : une date figée dans le HTML vieillit
       en silence, et personne ne pense à la relire.
       Pas de société sur ce cartouche : l'application est multi-locataire, et
       à cet instant on ne sait pas encore chez qui l'on entre. */
    const cartoucheDate = document.getElementById('cartoucheDate');
    if (cartoucheDate) {
      const d = new Date();
      const deuxChiffres = (n) => String(n).padStart(2, '0');
      cartoucheDate.textContent =
        deuxChiffres(d.getDate()) + '.' + deuxChiffres(d.getMonth() + 1) + '.' + deuxChiffres(d.getFullYear() % 100);
    }
  </script>
</body>
</html>
