<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Chantier - Connexion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      margin: 0;
      color: #182233;
      font-size: 28px;
      font-weight: 800;
    }

    .login-header p {
      margin: 8px 0 0;
      color: #6B7686;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #182233;
      font-weight: 600;
      font-size: 13.5px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E2E6ED;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success-message {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #E8F5EC;
      color: #1E6B37;
      font-size: 13px;
      line-height: 1.4;
    }
    .success-message.show { display: block; }
    .error-message {
      color: #D9363E;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #6B7686;
      font-size: 13px;
      margin-top: 8px;
    }

    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🏗️ ERP Chantier</h1>
      <p>Gestion complète de chantiers</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="votre@email.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        Se connecter
      </button>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>
      <div class="loading" id="loading">Connexion en cours...</div>
    </form>

    <div style="margin-top: 22px; text-align: center;">
      <button type="button" id="btnForgot"
              style="background:none; border:none; color:#6B7686; font-size:13px; cursor:pointer; text-decoration:underline;">
        Mot de passe oublié ?
      </button>
    </div>
  </div>

  <script type="module">
    import { supabase, demanderReinitialisation } from '@/api/client';

    // Session déjà ouverte : on n'affiche pas un formulaire de connexion à
    // quelqu'un de connecté, même s'il arrive ici par « Précédent ».
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.replace('/');
    })();

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnLogin = document.getElementById('btnLogin');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const btnForgot = document.getElementById('btnForgot');
    const loading = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Veuillez remplir tous les champs');
        return;
      }

      btnLogin.disabled = true;
      loading.classList.add('show');
      errorMessage.classList.remove('show');

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          throw error;
        }

        if (data.session) {
          // `replace` et non `href` : sans quoi la page de connexion reste dans
          // l'historique, et « Précédent » y ramène — ce qui donne l'illusion
          // d'une déconnexion alors que la session est toujours valide.
          window.location.replace('/');
        }
      } catch (err) {
        const message = err.message || 'Erreur de connexion. Vérifiez vos identifiants.';
        showError(message);
        btnLogin.disabled = false;
        loading.classList.remove('show');
      }
    });

    function showError(message) {
      successMessage.classList.remove('show');
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }

    function showSuccess(message) {
      errorMessage.classList.remove('show');
      successMessage.textContent = message;
      successMessage.classList.add('show');
    }

    /* Réinitialisation : Supabase envoie un lien qui repose une session
       « recovery » sur nouveau-mot-de-passe.html. */
    btnForgot.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showError('Saisissez votre email, puis cliquez à nouveau.');
        emailInput.focus();
        return;
      }
      btnForgot.disabled = true;
      try {
        await demanderReinitialisation(email);
        showSuccess('Si un compte existe pour ' + email + ', un lien de réinitialisation vient d\'être envoyé.');
      } catch (err) {
        showError(err.message || 'Envoi impossible. Réessayez dans un instant.');
      } finally {
        btnForgot.disabled = false;
      }
    });

  </script>
</body>
</html>
